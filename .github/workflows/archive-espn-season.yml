name: Archive completed ESPN season

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Optional ESPN season year to archive'
        required: false
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Archive completed ESPN seasons
        env:
          DYNASTY_SITE_URL: https://www.dynastynba.com
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            node scripts/archive-espn-season.mjs "${{ github.event.inputs.season }}"
          else
            node scripts/archive-espn-season.mjs
          fi

      - name: Commit new season snapshots
        run: |
          if git diff --quiet -- public/espn-archive; then
            echo "No completed season snapshots to commit."
            exit 0
          fi
          git config user.name "Dynasty NBA Archive Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/espn-archive
          git commit -m "Archive completed ESPN season"
          git push

name: Player Link Cleanup
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply safe exact-name ESPN links and commit them'
        required: true
        default: 'false'
        type: choice
        options: ['false','true']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: salary-engine-test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit or apply safe links
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/link-obvious-players.mjs public/data/site-data.json validation/player-link-audit.json --apply
          else
            node scripts/link-obvious-players.mjs public/data/site-data.json validation/player-link-audit.json
          fi
      - name: Commit safe links and report
        if: inputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/site-data.json validation/player-link-audit.json
          git diff --cached --quiet || git commit -m "Link obvious ESPN player records"
          git push origin HEAD:salary-engine-test
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: player-link-audit
          path: validation/player-link-audit.json

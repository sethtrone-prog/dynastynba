<style>
.historical-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}.historical-summary>div{padding:14px;border:1px solid rgba(190,160,85,.25);border-radius:8px;display:flex;flex-direction:column;gap:6px}.historical-summary b{font-size:22px}.historical-summary span,.historical-note{font-size:12px;opacity:.75}.historical-note{padding:14px 4px;line-height:1.5}#statisticsRoot th[data-stat-sort]{cursor:pointer;white-space:nowrap}#statisticsRoot .reference-tools{margin-bottom:18px}#statisticsRoot .num,#historicalPlayerScoring .num{text-align:right}

.history-subnav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.history-subnav button{background:transparent;color:inherit;border:1px solid rgba(190,160,85,.35);border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:600}.history-subnav button.active{border-color:#c5a75a;color:#c5a75a}

/* Current season ribbon: live scoreboard shortcut */
.season-ribbon .live-ribbon-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;background:#123b65;border:1px solid #c8a652;border-radius:6px;color:#f1cd70;font:700 13px Play,sans-serif;letter-spacing:.055em;padding:10px 17px;cursor:pointer;transition:background .18s,border-color .18s}
.season-ribbon .live-ribbon-button:hover{background:#1c507f;border-color:#f1cd70}
.live-ribbon-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#4ddc87;box-shadow:0 0 0 3px rgba(77,220,135,.12);animation:live-ribbon-pulse 2s ease-in-out infinite}
@keyframes live-ribbon-pulse{50%{box-shadow:0 0 0 6px rgba(77,220,135,0)}}
@media(max-width:720px){.season-ribbon .live-ribbon-button{width:100%;margin-top:8px;padding:12px 17px}}

/* Live scoring homepage feature — preview */
.live-score-feature-wrap{max-width:1280px;margin:18px auto 4px;padding:0 24px}
.live-score-feature{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 26px;background:linear-gradient(115deg,#102b4b,#173e69 62%,#0c2442);border:1px solid #c5a258;border-left:5px solid #d7ae50;border-radius:10px;color:#f1d18b;text-align:left;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.18);font-family:Play,sans-serif;transition:transform .18s,box-shadow .18s}
.live-score-feature:hover{transform:translateY(-2px);box-shadow:0 9px 28px rgba(0,0,0,.3)}
.live-score-feature-left{display:flex;align-items:center;gap:18px}
.live-score-feature-left strong{display:block;font-size:23px;letter-spacing:.07em;color:#f3d48c}
.live-score-feature-left small{display:block;margin-top:4px;font-size:13px;color:#d7e4f1;font-weight:400;letter-spacing:.01em}
.live-score-feature-dot{display:block;width:12px;height:12px;flex:none;background:#4cdb8a;border-radius:50%;box-shadow:0 0 0 5px rgba(76,219,138,.14);animation:live-ribbon-pulse 2s ease-in-out infinite}
.live-score-feature-cta{white-space:nowrap;border:1px solid #d5ad54;color:#f1d18b;border-radius:5px;padding:12px 17px;font-weight:700;letter-spacing:.045em;font-size:13px}
@media(max-width:720px){.live-score-feature-wrap{padding:0 14px;margin-top:12px}.live-score-feature{padding:18px;align-items:stretch;flex-direction:column;gap:16px}.live-score-feature-left strong{font-size:19px}.live-score-feature-cta{text-align:center}}
</style>

/* Visual polish for live Wins Pool surfaces. */
.wins-pool-live-page .card{overflow:hidden;}

.wins-pool-standings-card .section-title,
.owner-selections-card .section-title{
  border-bottom:1px solid rgba(127,192,255,.15);
}

.wins-pool-standings-table thead th,
.owner-selections-table thead th{
  background:#06182a;
  color:#9fb8ce;
  font-size:10px;
  letter-spacing:.65px;
  text-transform:uppercase;
}

.wins-pool-standings-table tbody tr{
  transition:background .15s ease;
}
.wins-pool-standings-table tbody tr:hover,
.owner-selections-table tbody tr:hover{
  background:rgba(127,192,255,.05);
}

.wins-pool-standings-table .rank-badge{
  display:inline-grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid #315878;
  background:#0a2238;
  color:#dce9f3;
  font-family:Oswald,Inter,system-ui,sans-serif;
  font-weight:700;
}
.wins-pool-standings-table .standing-1 .rank-badge{
  border-color:#f2c55d;
  background:rgba(242,197,93,.14);
  color:#f2c55d;
  box-shadow:0 0 0 1px rgba(242,197,93,.08) inset;
}
.wins-pool-standings-table .standing-2 .rank-badge{
  border-color:#9fb8ce;
  background:rgba(159,184,206,.10);
  color:#dce9f3;
}
.wins-pool-standings-table .standing-3 .rank-badge{
  border-color:#b57b46;
  background:rgba(181,123,70,.10);
  color:#d49a63;
}
.wins-pool-standings-table .pool-total{
  color:#f2c55d;
  font-family:Oswald,Inter,system-ui,sans-serif;
  font-size:17px;
  font-weight:700;
}

.performance{
  font-weight:800;
  font-family:Oswald,Inter,system-ui,sans-serif;
}
.performance.positive{color:#6ee7a5;}
.performance.negative{color:#e49a9a;}
.performance.neutral{color:#8ca3b7;}

.owner-selections-table tbody .owner-group-start td{
  border-top:2px solid #1d4d78;
}
.owner-selections-table .owner-summary{
  min-width:120px;
  vertical-align:middle;
  background:rgba(6,24,42,.65);
  border-right:1px solid #1d4d78;
}
.owner-selections-table .owner-summary b{
  display:block;
  color:#f2c55d;
  font-family:Oswald,Inter,system-ui,sans-serif;
  font-size:16px;
  letter-spacing:.2px;
}
.owner-selections-table .owner-summary small{
  display:block;
  margin-top:4px;
  color:#f2c55d;
  font-weight:700;
  white-space:nowrap;
}
.owner-selections-table .selection-pick span{
  display:inline-grid;
  place-items:center;
  min-width:28px;
  height:24px;
  padding:0 6px;
  border:1px solid #315878;
  border-radius:3px;
  background:#0a2238;
  color:#dce9f3;
  font-family:Oswald,Inter,system-ui,sans-serif;
  font-weight:700;
}
.owner-selections-table .selection-team b{color:#7fc0ff;}
.owner-selections-table .record{color:#9fb8ce;}

@media(max-width:760px){
  .wins-pool-standings-table,
  .owner-selections-table{min-width:780px;}
}

/* Column alignment only: preserve table cells, row spans, colors, and data. */
.wins-pool-live-page .wins-pool-standings-table th,
.wins-pool-live-page .wins-pool-standings-table td,
.wins-pool-live-page .owner-selections-table th,
.wins-pool-live-page .owner-selections-table td{
  vertical-align:middle;
}
.wins-pool-live-page .wins-pool-standings-table th:not(:nth-child(2)),
.wins-pool-live-page .wins-pool-standings-table td:not(:nth-child(2)){
  text-align:center;
}
.wins-pool-live-page .wins-pool-standings-table th:nth-child(2),
.wins-pool-live-page .wins-pool-standings-table td:nth-child(2){
  text-align:left;
}
/* Owner rows use rowspan, so positional td selectors cannot match headers. */
.wins-pool-live-page .owner-selections-table thead th:nth-child(1),
.wins-pool-live-page .owner-selections-table thead th:nth-child(3),
.wins-pool-live-page .owner-selections-table tbody td.owner-summary,
.wins-pool-live-page .owner-selections-table tbody td.selection-team{
  text-align:left;
}
.wins-pool-live-page .owner-selections-table thead th:nth-child(2),
.wins-pool-live-page .owner-selections-table thead th:nth-child(n+4),
.wins-pool-live-page .owner-selections-table tbody td.selection-pick,
.wins-pool-live-page .owner-selections-table tbody td.record,
.wins-pool-live-page .owner-selections-table tbody td.performance,
.wins-pool-live-page .owner-selections-table tbody td.selection-team ~ td{
  text-align:center;
}

/* Uniform Players table rows, retaining hover feedback. */
#playerTable tbody tr, #playerTable tbody tr:nth-child(odd), #playerTable tbody tr:nth-child(even), #playerTable tbody tr td { background:#0b263f !important; }
#playerTable tbody tr:hover, #playerTable tbody tr:hover td { background:#173c5c !important; }

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Matchup Details | Dynasty NBA Beta</title><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><style>body{background:#0a111d;color:#e6edf6;font:15px Play,sans-serif;margin:0}main{max-width:960px;margin:auto;padding:24px}h1{color:#eac577}.muted{color:#9aabc1}.card{background:#13263d;border:1px solid #34516c;border-radius:12px;margin:14px 0;padding:16px}summary{cursor:pointer;font-weight:bold;font-size:18px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.team{background:#0d1d30;padding:12px;border-radius:9px}.player{border-top:1px solid #34445c;padding:10px 0;display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;color:#eac577}.LIVE{color:#61e5a0}.FINAL{color:#abbcd1}.UPCOMING{color:#78c6ff}.error{color:#ff9b9b}@media(max-width:620px){.teams{grid-template-columns:1fr}}</style></head><body><main><p class="muted">DYNASTY NBA · ISOLATED BETA</p><h1>Expandable Matchup Details</h1><p class="muted">Active ESPN lineup positions only. Player fantasy points and historical lineup locks are not yet verified.</p><div id="status">Loading ESPN data…</div><div id="matchups"></div></main><script>
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/scoreboard-active-players?period=1');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Unavailable');const teams=new Map(d.teams.map(t=>[t.teamId,t]));document.getElementById('status').textContent='ESPN scoring period '+d.scoringPeriodId+' · '+d.date+' · Player points pending verification';document.getElementById('matchups').innerHTML=d.matchups.map((m,i)=>'<details class="card"><summary>Matchup '+(i+1)+' · Expand active players</summary><div class="teams">'+[m.homeTeamId,m.awayTeamId].map(id=>{const t=teams.get(id);return '<section class="team"><h3>Team '+safe(id)+'</h3>'+((t?.players||[]).length?t.players.map(p=>'<div class="player"><span>'+safe(p.name)+'<div class="tag '+safe(p.gameStatus)+'">'+safe(p.gameStatus)+' · '+safe(p.gameDetail||'')+'</div></span><strong>—</strong></div>').join(''):'<p class="muted">No active players with an NBA game today</p>')+'</section>'}).join('')+'</div></details>').join('');}catch(e){document.getElementById('status').innerHTML='<span class="error">'+safe(e.message)+'</span>';}}load();setInterval(load,60000);
</script></body></html>
